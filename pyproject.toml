[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sopa-sharad"
version = "2027.0.0a0"
description = "SHAllow RADar Open Processing Attempt — low-level processing of SHARAD Mars radar sounder data: PDS/CO-SHARPS readers, surface-clutter simulation, SOFA focusing, ENVI I/O"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Adamo Ferro"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "bitstring==5.0.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pypng==0.20220715.0",
    "scipy==1.18.1",
]

[project.optional-dependencies]
# interactive plotting backend (matplotlib Qt backend); not imported by the package itself
qt = ["PyQt6==6.11.0"]
# test framework (pytest); not imported by the package itself
test = ["pytest==9.1.1"]
# linter (ruff); not imported by the package itself
lint = ["ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
markers = [
    "realdata: requires /mnt/SOPA/DATA (PDS EDR + MOLA128); deselect with -m 'not realdata'",
    "slow: long-running test (minutes)",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# default rule set (E4/E7/E9/F) plus isort (I), pycodestyle warnings (W) and pyupgrade (UP)
select = ["E4", "E7", "E9", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# the example program's sys.path.insert shim (making the src tree importable)
# must precede the sopa imports, so E402 (module level import not at top of file) is expected there
"run_sopa_processing_2610.py" = ["E402"]
